"""
Sorrend
Query
Mutation
User, Event
"""
type Query {
    #User base queries
    users: [User!]! @all
    user(id: ID! @eq): User @find
    userLike(name: String! @like): [User!]! @all
    userPaginate(first: Int, page: Int): [User!]! @paginate
    #Event base queries
    events: [Event!]! @all
    event(id: ID! @eq): Event @find
    eventLike(title: String! @like): [Event!]! @all
    eventWhere(id: ID! @where(operator: ">")): [Event!]! @all
    eventPaginate(first: Int, page: Int): [Event!]! @paginate

    registration(id: ID! @eq): Registration @find
    registrationHasMany(id: ID! @eq): Registration @find
}

type Mutation {
    createUser(name: String!, email: String!, password: String!): User! @create
    updateUser(id: ID! @eq, name: String, email: String): User! @update
    deleteUser(id: ID! @eq): User! @delete

    createEvent(title: String!): Event! @create
    updateEvent(id: ID! @eq, title: String): Event! @update
    #függöségek miatt nem lehet törölni
    deleteEvent(id: ID! @eq): Event! @delete
}

type User {
    "Unique primary key."
    id: ID!

    "Non-unique name."
    name: String!

    "Unique email address."
    email: String!
}

type Event {
    id: ID!
    title: String!
}

type Registration {
    id: ID!
    user_id: ID!
    Event_id: ID!
    date: DateTime!
    user: User! @belongsTo
    registration: Registration! @hasMany
}
